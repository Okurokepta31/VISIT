<style>
  /* Layout: nautical chart plate. Name and contact ledger top-left, sea soundings fill the lower part of the screen. */
  :root {
    --bg: #e9f0e8;
    --surface: #f6faf4;
    --fg: #0f2a21;
    --muted: #4a6358;
    --accent: #0a7d56;
    --accent-ink: #ffffff;
    --brass: #8f6410;
    --line: rgba(15, 42, 33, .18);
    --hover: rgba(10, 125, 86, .09);
    --font-display: "Unbounded", "Onest", system-ui, sans-serif;
    --font-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a1d1a;
      --surface: #102a25;
      --fg: #e4f2e9;
      --muted: #9db8ab;
      --accent: #46d6a0;
      --accent-ink: #06231a;
      --brass: #d9b25c;
      --line: rgba(228, 242, 233, .2);
      --hover: rgba(70, 214, 160, .11);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a1d1a;
    --surface: #102a25;
    --fg: #e4f2e9;
    --muted: #9db8ab;
    --accent: #46d6a0;
    --accent-ink: #06231a;
    --brass: #d9b25c;
    --line: rgba(228, 242, 233, .2);
    --hover: rgba(70, 214, 160, .11);
    color-scheme: dark;
  }

  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    padding-block: clamp(18px, 4vh, 40px) 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }
  #sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; pointer-events: none; }

  .wrap {
    position: relative; z-index: 1;
    max-width: 1100px; margin: 0 auto;
    padding-inline: clamp(0px, 3vw, 40px);
    display: flex; flex-direction: column; gap: clamp(22px, 4.5vh, 44px);
    pointer-events: none;
  }
  .wrap > * { pointer-events: auto; }

  .top { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .tool {
    font: inherit; font-family: var(--font-mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 8px 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .tool:hover { border-color: var(--accent); color: var(--accent); }
  .tool[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .eq i { display: block; width: 3px; height: 14px; background: currentColor; border-radius: 1px; transform: scaleY(.2); transform-origin: bottom; }
  .tool[aria-pressed="true"] .eq i { animation: eq 1.2s ease-in-out infinite; }
  .tool[aria-pressed="true"] .eq i:nth-child(2) { animation-delay: -.4s; }
  .tool[aria-pressed="true"] .eq i:nth-child(3) { animation-delay: -.8s; }
  .tool[aria-pressed="true"] .eq i:nth-child(4) { animation-delay: -.2s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }

  .name {
    margin: 0; font-family: var(--font-display); font-weight: 700; line-height: 1;
    font-size: clamp(2.3rem, 10.4vw, 7.2rem); letter-spacing: -.02em;
    color: var(--accent); overflow-wrap: anywhere; text-wrap: balance;
  }
  .lead { margin: 14px 0 0; max-width: 30ch; font-size: clamp(1.05rem, 2.2vw, 1.35rem); line-height: 1.45; color: var(--muted); }

  .ledger {
    list-style: none; margin: 0; padding: 0;
    width: min(540px, 100%);
    background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
    box-shadow: 0 1px 0 var(--line);
  }
  .ledger li + li { border-top: 1px solid var(--line); }
  .row {
    display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 14px;
    width: 100%; box-sizing: border-box; padding: 14px 16px;
    background: none; border: 0; color: inherit; font: inherit; text-align: left; text-decoration: none; cursor: pointer;
    transition: background .2s;
  }
  .row:hover, .row:focus-visible { background: var(--hover); }
  .ico { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--accent); }
  .ico svg { width: 20px; height: 20px; }
  .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .t { font-weight: 600; font-size: 1.05rem; }
  .s { font-family: var(--font-mono); font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
  .act { font-size: .85rem; font-weight: 500; color: var(--accent); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .act::after { content: "→"; transition: transform .2s; }
  .row:hover .act::after, .row:focus-visible .act::after { transform: translateX(4px); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .toast {
    position: fixed; left: 50%; z-index: 20; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    padding: 11px 18px; border-radius: 3px; background: var(--fg); color: var(--bg); font-size: .92rem; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 480px) {
    .row { grid-template-columns: 40px minmax(0, 1fr); }
    .act { grid-column: 2; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .name, .lead, .ledger { animation: rise .7s cubic-bezier(.2, .8, .2, 1) both; }
    .lead { animation-delay: .08s; }
    .ledger { animation-delay: .16s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  }
  @media (prefers-reduced-motion: reduce) { .tool[aria-pressed="true"] .eq i { animation: none; transform: scaleY(.6); } }
</style>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const root = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- toast ---------- */
  const toastEl = $('#toast'); let tt;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  /* ---------- theme ---------- */
  const darkMq = matchMedia('(prefers-color-scheme: dark)');
  const currentTheme = () => root.dataset.theme || (darkMq.matches ? 'dark' : 'light');
  $('#theme').addEventListener('click', () => {
    root.dataset.theme = currentTheme() === 'dark' ? 'light' : 'dark';
    readColors(); if (reduce) draw(0);
  });
  if (darkMq.addEventListener) darkMq.addEventListener('change', () => { readColors(); if (reduce) draw(0); });

  /* ---------- sea: stroke-only ridge lines, grouped into 4 batched strokes ---------- */
  const cv = $('#sea'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, N = 0, TOP = 0, SP = 0;
  let ac_ = '#46d6a0';
  let mx = -9999, my = -9999, tx = -9999, ty = -9999;
  const ripples = [];

  function readColors() {
    ac_ = getComputedStyle(root).getPropertyValue('--accent').trim() || ac_;
  }
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const narrow = W < 700;
    N = narrow || H < 600 ? 14 : 20;
    TOP = H * (narrow ? 0.52 : 0.4);
    SP = (H - TOP + 20) / (N - 1);
    if (reduce) draw(0);
  }
  const lineY = (i, x, t) => {
    const k = i / (N - 1), amp = SP * (0.25 + 0.55 * k);
    return TOP + SP * i + amp * (0.6 * Math.sin(x * 0.006 + t * 0.5 + i * 0.35) + 0.4 * Math.sin(x * 0.013 - t * 0.8 + i * 0.6));
  };

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    const paths = [new Path2D(), new Path2D(), new Path2D(), new Path2D()];
    const STEP = W < 700 ? 14 : 12;
    for (let i = 0; i < N; i++) {
      const k = i / (N - 1), P = paths[Math.min(3, (k * 4) | 0)];
      const base = TOP + SP * i, near = Math.abs(base - my) < 160;
      for (let x = -STEP; x <= W + STEP; x += STEP) {
        let y = lineY(i, x, t);
        if (near) { const dx = x - mx, dy = base - my; y -= 18 * Math.exp(-(dx * dx) / 18000 - (dy * dy) / 9000) * Math.sin(t * 3 + x * 0.04); }
        x === -STEP ? P.moveTo(x, y) : P.lineTo(x, y);
      }
    }
    ctx.strokeStyle = ac_; ctx.lineJoin = 'round';
    for (let b = 0; b < 4; b++) { ctx.globalAlpha = 0.2 + 0.2 * b; ctx.lineWidth = 1.1 + 0.25 * b; ctx.stroke(paths[b]); }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i], p = r.t;
      ctx.globalAlpha = (1 - p) * 0.55; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, 10 + p * 150, 3 + p * 42, 0, 0, 6.2832); ctx.stroke();
      if (p >= 1) ripples.splice(i, 1);
    }
    ctx.globalAlpha = 1;
  }

  let last = 0, clock = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (now - last < 15) return;
    const dt = Math.min((now - last) / 1000, 0.1); last = now;
    clock += dt;
    for (const r of ripples) r.t += dt / 1.4;
    mx += (tx - mx) * 0.12; my += (ty - my) * 0.12;
    draw(clock);
  }

  window.addEventListener('pointermove', e => {
    if (mx < -999) { mx = e.clientX; my = e.clientY; }
    tx = e.clientX; ty = e.clientY;
  }, { passive: true });
  window.addEventListener('pointerdown', e => {
    if (!reduce && e.clientY > TOP - 40) ripples.push({ x: e.clientX, y: e.clientY, t: 0 });
  }, { passive: true });
  window.addEventListener('resize', resize);
  readColors(); resize();
  if (!reduce) requestAnimationFrame(t => { last = t; frame(t); });

  /* ---------- audio: ambient pads, sea noise, soft bells ---------- */
  let ac = null, sfx = null, master = null, bus = null, playing = false, timers = [];
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);
  const CHORDS = [[45, 52, 57, 60, 64], [41, 48, 53, 57, 60], [48, 55, 60, 64], [43, 50, 55, 59, 62]];
  const PENT = [69, 72, 74, 76, 79, 81, 84];

  function ensureAc() {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      sfx = ac.createGain(); sfx.gain.value = 0.9; sfx.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
  }
  function buildAmbient() {
    if (master) return;
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    bus = ac.createGain(); bus.connect(master);
    const delay = ac.createDelay(1); delay.delayTime.value = 0.46;
    const fb = ac.createGain(); fb.gain.value = 0.4;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    bus.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(master);
    const len = ac.sampleRate * 4, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    let l = 0;
    for (let i = 0; i < len; i++) { l = (l + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = l * 3.5; }
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
    const ng = ac.createGain(); ng.gain.value = 0.05;
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.11;
    const lg = ac.createGain(); lg.gain.value = 0.035;
    lfo.connect(lg); lg.connect(ng.gain);
    src.connect(f); f.connect(ng); ng.connect(master);
    src.start(); lfo.start();
  }
  function pad(freq, t0, dur) {
    [-7, 7].forEach(det => {
      const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = freq; o.detune.value = det;
      const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = freq < 150 ? 500 : 1100;
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.028, t0 + 2.6);
      g.gain.setValueAtTime(0.028, t0 + dur - 0.5); g.gain.linearRampToValueAtTime(0, t0 + dur + 3);
      o.connect(fl); fl.connect(g); g.connect(bus); o.start(t0); o.stop(t0 + dur + 3.2);
    });
  }
  function chord(i) {
    if (!playing) return;
    const t0 = ac.currentTime + 0.05;
    CHORDS[i].forEach(n => pad(midi(n), t0, 8));
    timers.push(setTimeout(() => chord((i + 1) % CHORDS.length), 7800));
  }
  function bell() {
    if (!playing) return;
    const t0 = ac.currentTime + 0.02, f = midi(PENT[Math.floor(Math.random() * PENT.length)]);
    [[1, 0.05], [2, 0.012], [3, 0.005]].forEach(([m, a]) => {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(a, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.2);
      o.connect(g); g.connect(bus); o.start(t0); o.stop(t0 + 3.3);
    });
    timers.push(setTimeout(bell, 1800 + Math.random() * 2800));
  }
  const btn = $('#sound');
  function ui(on) {
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', on ? 'Выключить эмбиент' : 'Включить эмбиент');
  }
  function play() {
    try {
      ensureAc(); buildAmbient();
      playing = true;
      master.gain.cancelScheduledValues(ac.currentTime);
      master.gain.setTargetAtTime(0.8, ac.currentTime, 0.6);
      chord(0); timers.push(setTimeout(bell, 1500));
      ui(true);
    } catch (e) { toast('Не удалось запустить звук'); }
  }
  function pause() {
    if (!ac || !master) return;
    playing = false; timers.forEach(clearTimeout); timers = [];
    master.gain.setTargetAtTime(0, ac.currentTime, 0.4);
    ui(false);
  }
  btn.addEventListener('click', () => playing ? pause() : play());
  document.addEventListener('visibilitychange', () => {
    if (!ac || !playing) return;
    document.hidden ? ac.suspend() : ac.resume();
  });

  /* ---------- discord copy ---------- */
  $('#discord').addEventListener('click', async () => {
    const nick = 'degshipcaptaindeg';
    try { await navigator.clipboard.writeText(nick); toast('Ник скопирован: ' + nick); return; } catch (e) {}
    try {
      const ta = document.createElement('textarea'); ta.value = nick; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove();
      toast(ok ? 'Ник скопирован: ' + nick : 'Мой ник в Discord: ' + nick);
    } catch (e) { toast('Мой ник в Discord: ' + nick); }
  });
})();
</script>
